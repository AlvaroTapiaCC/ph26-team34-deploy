# Configuración para la PREDICCIÓN CONGELADA de validación (docs/plan-desarrollo.md §8.1).
#
# Es una copia de formula.yaml con dos cambios en p_pred:
#   - w_dias y w_cam valen 0: días desde la limpieza es simulado y la cámara no tiene
#     señal antes del congelamiento, así que no pueden entrar a una predicción que se valida.
#   - Los otros seis pesos se reescalan dividiendo por 0,76 (su suma en formula.yaml) para
#     que sigan sumando 1. Se conservan las proporciones entre ellos.
# Todo lo demás es idéntico a formula.yaml; tests/test_formula_validacion.py lo verifica.
# La demo usa formula.yaml completa. Después de congelar, este archivo no se toca.

version: 1

# ---------------------------------------------------------------------------
# Paso 1: probabilidad de que el sumidero se tape (§6.1)
# P_pred = clamp(Σ w_i · x_i, 0, 1)
# La suma de pesos es ~1, así que un sumidero con todo al máximo llega a P = 1.
# ---------------------------------------------------------------------------
p_pred:
  w_arb: 0.289474  # árboles sobre o cerca de la rejilla: la principal fuente de hojas
  w_feria: 0.184211  # feria libre cercana y próxima: basura concentrada en días fijos
  w_obra: 0.105263  # obras cercanas: tierra y sedimento
  w_suelo: 0.105263  # zonas quemadas o suelo desnudo aguas arriba: sedimento con la lluvia
  w_pend: 0.184211  # arrastre por pendiente: más material llega a la rejilla
  w_clima: 0.131578  # viento y lluvia recientes: botan hojas y arrastran material
  w_dias: 0.0        # simulada o sin dato antes del congelamiento: fuera de la validación
  w_cam: 0.0        # simulada o sin dato antes del congelamiento: fuera de la validación

# Cómo se llevan a 0-1 las variables que vienen en otras unidades
normalizacion:
  dias_sin_limpieza_max: 90   # 90 días o más sin limpieza = 1

# Features que son simuladas aunque vengan en sumideros.features. La prueba de campo
# (incluir_simulados = false) las ignora (§8.1).
features_simuladas: [dias_sin_limpieza, camara]

# Lo confirmado manda: una foto reciente con rejilla evaluable fija P.
observado:
  tapada: 0.95
  parcial: 0.6
  limpia: 0.05
  vigencia_horas: 72          # una foto deja de "mandar" después de este tiempo

# Reportes de texto sin foto suben P, pero pesan menos que una foto.
reportes_texto:
  factor: 0.5                 # un texto vale la mitad que una foto
  aporte_por_reporte: 0.3     # cuánto suma un reporte de texto (antes del factor)
  max_aporte: 0.5             # tope de lo que pueden sumar varios reportes juntos
  # Solo estos tipos indican obstrucción. Un "anegamiento" dice cuánta agua hay, no que la
  # rejilla esté tapada: entra a la consecuencia como nivel de agua en Durante (§6.5).
  tipos_que_suben_p: [rejilla_tapada, basura]

# ---------------------------------------------------------------------------
# Paso 2: efecto en cadena calle abajo (§6.2)
# P_ef(i) = min(P(i) + α · Σ_{j aguas arriba} P(j) · e^(-d_ij/λ), P(i) + tope)
# ---------------------------------------------------------------------------
cadena:
  alpha: 0.35      # intensidad del efecto
  lambda_m: 150    # metros a los que el aporte cae a ~37 %
  tope: 0.3        # cuánto puede subir como máximo un sumidero por la cadena

# ---------------------------------------------------------------------------
# Paso 3: consecuencia (§6.3)
# C = norm(área_que_le_llega) · (1 + w_crit · criticidad_cercana)
# ---------------------------------------------------------------------------
consecuencia:
  # norm(área): 'log' usa log(1+área)/log(1+máx) porque las áreas tienen colas largas;
  # 'lineal' divide por el máximo.
  normalizacion_area: log
  # Piso del área: C = (piso + (1 - piso)·norm(área))·(1 + w_crit·criticidad).
  # Sin piso, un sumidero sin área de aporte quedaría con prioridad 0 aunque esté tapado.
  piso_area: 0.15
  w_crit: 1.0          # con criticidad máxima, la consecuencia se duplica
  radio_crit_m: 200    # radio para buscar infraestructura crítica
  # Peso de cada tipo de infraestructura en criticidad_cercana (se toma el máximo).
  criticidad:
    metro: 1.0
    paso_bajo_nivel: 1.0
    hospital: 0.9
    punto_critico_gobierno: 0.8
    colegio: 0.6

# ---------------------------------------------------------------------------
# Ajustes para la fase "Durante" (§6.5)
# C_durante = C · (1 + w_agua · nivel_agua_observado)
# ---------------------------------------------------------------------------
durante:
  w_agua: 1.0
  nivel_agua:
    sobre_vereda: 1.0
    hasta_vereda: 0.6
    cuneta: 0.3
    sin_agua: 0.0
  # Reportes que cuentan como el mismo caso (§7.2)
  vigencia_agua_horas: 6     # cuánto dura una observación de agua
  vigencia_urgente_horas: 6  # un caso urgente sin cerrar deja de adelantarse después de esto
  caso_radio_m: 75
  caso_ventana_min: 60
